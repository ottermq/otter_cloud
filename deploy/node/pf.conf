# /etc/pf.conf: Otter node. Static, hand-maintained; no tool rewrites this file.
# Source: deploy/node/pf.conf in otter_cloud (docs/runbook-m0.md Part D).

tenant_net = "10.64.0.0/24"   # JailDeck network "clusters" (#16)
tenant_gw  = "10.64.0.1"
# Minimum profile only: the control plane's jails, on JailDeck network
# "platform" (#58). A node without them keeps the table, empty of jails.
platform_net = "10.64.1.0/24"
platform_gw  = "10.64.1.1"
otter_db     = "10.64.1.10"
otter_api    = "10.64.1.20"
# edge_tun = "10.62.0.1"        # WireGuard tunnel address of the edge (#22)

table <tenants>  const { $tenant_net, !$tenant_gw }
table <platform> const { $platform_net, !$platform_gw }

set skip on lo0
set block-policy drop

# --- Translation: JailDeck's networks (JD-040, JD-043) -----------------------
nat-anchor "jaildeck/*"

# --- Tenant isolation (the policy Otter depends on) --------------------------

# Node host (worker) → tenant PostgreSQL and PgBouncer.
pass  quick inet proto tcp  from $tenant_gw to <tenants> port { 5432 6432 }
pass  quick inet proto icmp from $tenant_gw to <tenants> icmp-type echoreq

# Edge → PgBouncer (#22).
# pass quick inet proto tcp from $edge_tun to <tenants> port 6432

# Tenants never open connections: not to the host, LAN, internet, or each other.
block drop log quick from <tenants>
# Nobody else reaches tenants: LAN hosts, non-Otter jails, other tenants.
block drop log quick to <tenants>

# --- Control plane, minimum profile (#58) ------------------------------------

# Node host (worker, otter migrate, otter admin) → the platform DB.
pass  quick inet proto tcp from $platform_gw to $otter_db port 5432
# The api → the platform DB; the only connection the api opens.
pass  quick inet proto tcp from $otter_api to $otter_db port 5432
# Node host → the api, for checks.
pass  quick inet proto tcp from $platform_gw to $otter_api port 8080

# Edge → the api (#22).
# pass quick inet proto tcp from $edge_tun to $otter_api port 8080

# The control plane opens nothing else: no egress, no host, no tenants.
block drop log quick from <platform>
# Nobody else reaches it: tenants, LAN hosts, non-Otter jails.
block drop log quick to <platform>

# --- JailDeck's networks: its rules between them -----------------------------
anchor "jaildeck/*"

# --- Everything else: unchanged host behaviour for now ------------------------
pass all

load anchor "jaildeck/vmnet" from "/usr/local/etc/jaildeck/pf/vmnet.conf"
