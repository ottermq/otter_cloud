# Unit tests for rules/otter.yml: promtool test rules rules/otter_test.yml
# The acceptance of #121 in simulation: a worker stopped, the tunnel down, a
# cluster down. Not installed on the VPS.
rule_files: [otter.yml]
evaluation_interval: 30s

tests:
  # The worker stopped: its target is down and its heartbeat goes stale;
  # the host still answers, so the node is reachable.
  - interval: 30s
    input_series:
      - series: 'up{job="node",node="node1"}'
        values: '1x40'
      - series: 'up{job="worker",node="node1"}'
        values: '1 0x39'
      - series: 'otter_node_last_seen_timestamp_seconds{job="api",node="node1"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: page, job: worker, node: node1}
            exp_annotations: {summary: "worker metrics can't be scraped."}
      - eval_time: 10m
        alertname: WorkerSilent
        exp_alerts:
          - exp_labels: {severity: page, job: api, node: node1}
            exp_annotations: {summary: "The node's worker has recorded no heartbeat for 5 minutes."}
      - eval_time: 10m
        alertname: NodeUnreachable
        exp_alerts: []

  # After a reboot JailDeck lost the clusters' network; later JailDeck
  # itself stops answering the worker (#200).
  - interval: 30s
    input_series:
      - series: 'otter_jaildeck_networks_missing{job="worker",node="node1"}'
        values: '0x10 1x30'
      - series: 'otter_jaildeck_up{job="worker",node="node1"}'
        values: '1x20 0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: JailNetworksMissing
        exp_alerts: []
      - eval_time: 9m
        alertname: JailNetworksMissing
        exp_alerts:
          - exp_labels: {severity: page, job: worker, node: node1}
            exp_annotations: {summary: "JailDeck is missing 1 of the node's networks: its jails are cut off."}
      - eval_time: 9m
        alertname: JailDeckDown
        exp_alerts: []
      - eval_time: 14m
        alertname: JailDeckDown
        exp_alerts:
          - exp_labels: {severity: page, job: worker, node: node1}
            exp_annotations: {summary: "The node's worker can't reach JailDeck."}

  # The tunnel is down: no handshake, and nothing on the node can be
  # scraped.
  - interval: 30s
    input_series:
      - series: 'wireguard_latest_handshake_seconds{job="host",node="edge",interface="wg0",peer="10.62.0.2"}'
        values: '0x40'
      - series: 'up{job="node",node="node1"}'
        values: '0x40'
      - series: 'up{job="worker",node="node1"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: WireGuardHandshakeStale
        exp_alerts:
          - exp_labels: {severity: page, job: host, node: edge, interface: wg0, peer: 10.62.0.2}
            exp_annotations: {summary: "The node's tunnel has had no handshake for 5 minutes."}
      - eval_time: 10m
        alertname: NodeUnreachable
        exp_alerts:
          - exp_labels: {severity: page, node: node1}
            exp_annotations: {summary: "The node can't be reached through the tunnel."}

  # A cluster down: every database on it, and not those of another.
  - interval: 30s
    input_series:
      - series: 'otter_instance_up{job="worker",node="node1",cluster="pgc1",database="otc_000000000001"}'
        values: '0x20'
      - series: 'otter_instance_up{job="worker",node="node1",cluster="pgc1",database="otc_000000000002"}'
        values: '0x20'
      - series: 'otter_instance_up{job="worker",node="node1",cluster="pgc2",database="otc_000000000003"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ClusterDown
        exp_alerts:
          - exp_labels: {severity: page, node: node1, cluster: pgc1}
            exp_annotations: {summary: "No database on the cluster takes connections."}

  # A nightly dump overdue, from the platform DB's record of the last one:
  # made at time 0, so not yet stale at 25 h, stale at 27 h.
  - interval: 1h
    input_series:
      - series: 'otter_backup_last_success_timestamp_seconds{job="worker",node="node1",kind="dump",target="offsite"}'
        values: '0x30'
      - series: 'otter_instance_up{job="worker",node="node1",cluster="pgc1",database="otc_000000000001"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25h
        alertname: DumpStale
        exp_alerts: []
      - eval_time: 27h
        alertname: DumpStale
        exp_alerts:
          - exp_labels: {severity: ticket, job: worker, node: node1, kind: dump, target: offsite}
            exp_annotations: {summary: "No nightly dump has succeeded to offsite for over 26 hours."}

  # The same stale dump on a node whose databases are all gone: nothing
  # to dump, so no alert. Another node's database doesn't count.
  - interval: 1h
    input_series:
      - series: 'otter_backup_last_success_timestamp_seconds{job="worker",node="node1",kind="dump",target="offsite"}'
        values: '0x30'
      - series: 'otter_instance_up{job="worker",node="node2",cluster="pgc2",database="otc_000000000002"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 27h
        alertname: DumpStale
        exp_alerts: []

  # The isolation check, as node_exporter serves its file at every scrape:
  # 0 until 30m, a breach (1) until 60m, then can't run (2), last finished
  # at 60m. A breach pages at once; a check that can't run opens a ticket
  # after an hour; one that stops finishing, after 90 minutes.
  - interval: 1m
    input_series:
      - series: 'otter_isolation_check_exit_code{job="node",node="node1"}'
        values: '0x29 1x29 2x120'
      - series: 'otter_isolation_check_last_run_timestamp_seconds{job="node",node="node1"}'
        values: '0x29 1800x29 3600x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: IsolationBreach
        exp_alerts: []
      - eval_time: 31m
        alertname: IsolationBreach
        exp_alerts:
          - exp_labels: {severity: page, job: node, node: node1}
            exp_annotations: {summary: "The isolation check found 1 probe(s) wrong; see the node's isolation-check log."}
      - eval_time: 90m
        alertname: IsolationCheckError
        exp_alerts: []
      - eval_time: 125m
        alertname: IsolationCheckError
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: node1}
            exp_annotations: {summary: "The isolation check couldn't run (a jail it probes isn't running?)."}
      - eval_time: 140m
        alertname: IsolationCheckStale
        exp_alerts: []
      - eval_time: 155m
        alertname: IsolationCheckStale
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: node1}
            exp_annotations: {summary: "The isolation check hasn't finished a run for over 90 minutes."}
