# /etc/systemd/system/nftables.service.d/only-ours.conf
# Debian's nftables.service runs "nft flush ruleset" when it stops or
# restarts, which also removes other tools' tables. Stop and reload touch
# only the table nftables.conf owns.
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet filter
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
