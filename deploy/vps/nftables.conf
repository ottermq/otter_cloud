#!/usr/sbin/nft -f
# /etc/nftables.conf: the edge VPS (architecture.md §7, #104).
# Source: deploy/vps/nftables.conf in otter_cloud. Static, hand-maintained.
#
# From the internet: 443 (portal), 5432 (databases), 51820/udp (WireGuard)
# and SSH from an allowlist. From the tunnel: nothing; the edge opens
# connections to the nodes and the control plane, never the reverse.
# Nothing is forwarded: nodes never talk to each other through the hub.

# Replace only this table. Other tools on the VPS (a management VPN, for
# one) keep their own, and a "flush ruleset" here would take them too.
table inet filter
delete table inet filter

table inet filter {
    # SSH from these addresses only. Empty, SSH is closed: add the
    # operator's addresses, or accept SSH on a management interface below,
    # before loading this file over SSH.
    set ssh_allow_v4 {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept   # IPv6 needs it, even unused

        # The tunnel carries replies only.
        iifname "wg0" drop

        udp dport 51820 accept
        tcp dport { 443, 5432 } accept
        ip saddr @ssh_allow_v4 tcp dport 22 accept
        # SSH over a management interface instead of an allowlist:
        # iifname "<management interface>" tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
